<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#071a12">
  <title>PREDADOR | Accesos</title>

  <style>
    :root {
      color-scheme: dark;
      --fondo: #071a12;
      --tarjeta: #10271c;
      --lima: #c0f75a;
      --texto: #f4f8ef;
      --secundario: #a6bbad;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      color: var(--texto);
      background:
        radial-gradient(ellipse at top right, #25492b55, transparent 55%),
        var(--fondo);
    }

    .contenedor {
      width: min(1120px, 90%);
      margin: 0 auto;
    }

    header {
      padding: 25px 0;
      border-bottom: 1px solid #ffffff12;
    }

    .marca {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      font-weight: 800;
      letter-spacing: 3px;
    }

    .icono {
      display: grid;
      place-items: center;
      width: 38px;
      height: 38px;
      border-radius: 12px;
      background: var(--lima);
      color: var(--fondo);
      font-size: 26px;
    }

    main { padding: 65px 0; }

    .etiqueta {
      color: var(--lima);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 4px;
    }

    h1 {
      margin: 15px 0;
      font-size: clamp(42px, 9vw, 88px);
      letter-spacing: -2px;
      line-height: 1;
    }

    .descripcion {
      max-width: 560px;
      margin: 20px 0 42px;
      color: var(--secundario);
      font-size: 18px;
      line-height: 1.6;
    }

    .grilla {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 20px;
    }

    .tarjeta {
      display: flex;
      flex-direction: column;
      min-width: 0;
      padding: 26px;
      border: 1px solid #ffffff14;
      border-radius: 22px;
      background: var(--tarjeta);
      transition: transform .25s ease,
                  border-color .25s ease,
                  box-shadow .25s ease;
    }

    .tarjeta:hover {
      transform: translateY(-6px);
      border-color: #c0f75a70;
      box-shadow: 0 16px 32px #00000030;
    }

    .numero {
      color: var(--lima);
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 2px;
    }

    h2 {
      margin: 24px 0 8px;
      font-size: 23px;
      overflow-wrap: anywhere;
    }

    .dominio {
      margin: 0 0 28px;
      color: var(--secundario);
      font-size: 14px;
      overflow-wrap: anywhere;
    }

    .boton {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-top: auto;
      padding: 14px 16px;
      border-radius: 12px;
      background: var(--lima);
      color: var(--fondo);
      font-size: 14px;
      font-weight: 700;
      text-decoration: none;
    }

    .boton:hover { background: #d2ff85; }

    .boton:focus-visible {
      outline: 3px solid white;
      outline-offset: 5px;
    }

    .boton[aria-disabled="true"] {
      background: #ffffff10;
      color: var(--secundario);
      cursor: default;
    }

    footer {
      padding: 26px 0;
      border-top: 1px solid #ffffff12;
      color: var(--secundario);
      text-align: center;
      font-size: 12px;
      letter-spacing: 2px;
    }

    @media (max-width: 900px) {
      .grilla { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }

    @media (max-width: 580px) {
      .grilla { grid-template-columns: 1fr; }
      main { padding: 45px 0; }
      .descripcion { font-size: 16px; }
    }

    @media (prefers-reduced-motion: reduce) {
      .tarjeta { transition: none; }
      .tarjeta:hover { transform: none; }
    }
  </style>
</head>

<body>
  <header>
    <div class="contenedor">
      <div class="marca">
        <span class="icono" aria-hidden="true">↗</span>
        PREDADOR
      </div>
    </div>
  </header>

  <main class="contenedor">
    <div class="etiqueta">TODOS TUS ACCESOS</div>

    <h1>PREDADOR</h1>

    <p class="descripcion">
      Con tu usuario y contraseña podés acceder a cualquiera de estos links
    </p>

    <section class="grilla" id="paginas" aria-label="Páginas disponibles">
    </section>
  </main>

  <footer>
    <div class="contenedor">PREDADOR · ACCESOS DIRECTOS</div>
  </footer>

  <script>
    // 🟠🟠🟠 EDITAR ACÁ: NOMBRES Y LINKS 🟠🟠🟠
    // Reemplazá cada PEGAR_LINK por una dirección con https://
    // Conservá las comillas y las comas.
    // Ejemplo:
    // { nombre: "Mi página", link: "https://ejemplo.com" },

    const paginas = [
      { nombre: "Apostamos-uno", link: "https://www.apostamos.uno/" },
      { nombre: "Bet-30",  link: "https://www.bet-30.cc/" },
      { nombre: "Casino-Zeus",  link: "https://www.casino-zeus.me/" },
      { nombre: "Celu-apuesta",  link: "https://www.celu-apuesta.com/" },
      { nombre: "Deuna.bet",  link: "https://www.deuna.bet/" },
      { nombre: "Gana-en-casa",  link: "https://www.ganaencasa.vip/" },
      { nombre: "Ganamos-bet",  link: "https://www.ganamosbet.uno/" },
      { nombre: "Konabet",  link: "https://www.konabet.uno/" },
      { nombre: "Pinkbet",  link: "https://www.pinkbet.online/" },
      { nombre: "Trebol-uno", link: "https://www.trebol.uno/" }
    ];

    // FIN DE LA ZONA PARA EDITAR.

    const grilla = document.getElementById("paginas");

    paginas.forEach((pagina, indice) => {
      let url = null;

      try {
        const candidata = new URL(pagina.link);
        if (["https:", "http:"].includes(candidata.protocol)) {
          url = candidata;
        }
      } catch {
        // El botón queda desactivado hasta agregar un link válido.
      }

      const tarjeta = document.createElement("article");
      tarjeta.className = "tarjeta";

      const numero = document.createElement("span");
      numero.className = "numero";
      numero.textContent = String(indice + 1).padStart(2, "0");

      const nombre = document.createElement("h2");
      nombre.textContent = pagina.nombre;

      const dominio = document.createElement("p");
      dominio.className = "dominio";
      dominio.textContent = url
        ? url.hostname
        : "Enlace pendiente de configurar";

      const boton = document.createElement("a");
      boton.className = "boton";
      boton.textContent = "Abrir página";

      const flecha = document.createElement("span");
      flecha.textContent = "↗";
      flecha.setAttribute("aria-hidden", "true");
      boton.appendChild(flecha);

      if (url) {
        boton.href = url.href;
        boton.target = "_blank";
        boton.rel = "noopener noreferrer";
        boton.setAttribute(
          "aria-label",
          "Abrir " + pagina.nombre + " en una pestaña nueva"
        );
      } else {
        boton.setAttribute("aria-disabled", "true");
      }

      tarjeta.append(numero, nombre, dominio, boton);
      grilla.appendChild(tarjeta);
    });
  </script>
</body>
</html>
