
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RÍO FORTUNA</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #071b15;
      color: #ffffff;
      min-height: 100vh;
    }

    header {
      padding: 25px 8%;
      background: #0b261c;
      border-bottom: 1px solid #244c36;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .logo {
      color: #a3ff69;
      font-size: 22px;
      font-weight: bold;
      letter-spacing: 2px;
    }

    .hero {
      text-align: center;
      padding: 75px 20px 45px;
    }

    .hero h1 {
      font-size: clamp(38px, 7vw, 68px);
      color: #a3ff69;
      letter-spacing: 3px;
      margin-bottom: 18px;
    }

    .hero p {
      color: #bdcfc4;
      font-size: 17px;
      line-height: 1.6;
    }

    .contenedor {
      max-width: 1150px;
      margin: auto;
      padding: 35px 22px 80px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 25px;
    }

    .tarjeta {
      background: #123125;
      border: 1px solid #28543b;
      border-radius: 20px;
      padding: 30px 22px;
      text-align: center;
      transition: 0.3s ease;
    }

    .tarjeta:hover {
      transform: translateY(-7px);
      border-color: #a3ff69;
      box-shadow: 0 12px 35px #00000040;
    }

    .icono {
      width: 65px;
      height: 65px;
      background: #214b32;
      border-radius: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      margin: 0 auto 20px;
    }

    .tarjeta h2 {
      font-size: 23px;
      margin-bottom: 12px;
    }

    .tarjeta p {
      color: #a9c0b0;
      font-size: 14px;
      margin-bottom: 28px;
    }

    .botones {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .boton {
      display: block;
      width: 100%;
      padding: 15px;
      border-radius: 12px;
      font-weight: bold;
      text-decoration: none;
      font-size: 15px;
      transition: 0.2s;
    }

    .ingresar {
      background: #a3ff69;
      color: #092015;
    }

    .ingresar:hover {
      background: #c1ff9d;
    }

    .whatsapp {
      background: #20543a;
      color: #ffffff;
      border: 1px solid #397f56;
    }

    .whatsapp:hover {
      background: #287247;
    }

    .deshabilitado {
      opacity: 0.5;
      pointer-events: none;
    }

    footer {
      text-align: center;
      color: #809c8a;
      font-size: 13px;
      padding: 30px;
      border-top: 1px solid #244c36;
    }

    @media (max-width: 900px) {
      .contenedor {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (max-width: 600px) {
      .contenedor {
        grid-template-columns: 1fr;
      }

      .hero {
        padding-top: 55px;
      }
    }
  </style>
</head>

<body>

  <header>
    <div class="logo">RÍO FORTUNA</div>
    <span>✦</span>
  </header>

  <section class="hero">
    <h1>RÍO FORTUNA</h1>
    <p>
      Elegí tu plataforma para ingresar.
      <br>
      ¿Todavía no tenés cuenta?
      Solicitá una por WhatsApp.
    </p>
  </section>

  <main class="contenedor" id="plataformas"></main>

  <footer>
    © 2026 RÍO FORTUNA
  </footer>

  <script>
    const whatsapp = "543794705606";


    // 🟢 TUS TRES PLATAFORMAS
    // Reemplazá los nombres y los enlaces.

    const plataformas = [

      {
        nombre: "Predador",
        link: "https://predador-3gj9.vercel.app/"
      },

      {
        nombre: "Bet30",
        link: "https://bet30-links.keen-calf-7239.chatgpt.site"
      },

      {
        nombre: "Ganamos",
        link: "https://mis-sitios-dana.keen-calf-7239.chatgpt.site"
      }

    ];


    const contenedor =
      document.getElementById("plataformas");

    function crearTarjetas() {

      plataformas.forEach((plataforma, index) => {

        const tarjeta =
          document.createElement("article");

        tarjeta.className = "tarjeta";

        const icono =
          document.createElement("div");

        icono.className = "icono";
        icono.textContent = "🌟";

        const titulo =
          document.createElement("h2");

        titulo.textContent = plataforma.nombre;

        const descripcion =
          document.createElement("p");

        descripcion.textContent =
          "Ingresá o solicitá tu cuenta.";

        const botones =
          document.createElement("div");

        botones.className = "botones";

        // BOTÓN INGRESAR

        const ingresar =
          document.createElement("a");

        ingresar.className =
          "boton ingresar";

        ingresar.textContent =
          "↗ Ingresar";

        const linkValido =
          plataforma.link &&
          /^https?:\/\//i.test(plataforma.link) &&
          !/^https?:\/\/www\.ejemplo\d+\.com\/?$/i.test(
            plataforma.link
          );

        if (linkValido) {
          ingresar.href = plataforma.link;
          ingresar.target = "_blank";
          ingresar.rel = "noopener noreferrer";
        } else {
          ingresar.classList.add("deshabilitado");
          ingresar.removeAttribute("href");
          ingresar.textContent =
            "Próximamente";
        }

        // BOTÓN WHATSAPP

        const mensaje =
          "¡Hola! Quiero solicitar una cuenta en " +
          plataforma.nombre + ".";

        const enlaceWhatsapp =
          "https://wa.me/" +
          whatsapp +
          "?text=" +
          encodeURIComponent(mensaje);

        const solicitar =
          document.createElement("a");

        solicitar.className =
          "boton whatsapp";

        solicitar.href = enlaceWhatsapp;
        solicitar.target = "_blank";
        solicitar.rel = "noopener noreferrer";

        solicitar.textContent =
          "☏ Solicitar cuenta";

        botones.appendChild(ingresar);
        botones.appendChild(solicitar);

        tarjeta.appendChild(icono);
        tarjeta.appendChild(titulo);
        tarjeta.appendChild(descripcion);
        tarjeta.appendChild(botones);

        contenedor.appendChild(tarjeta);

      });

    }

    crearTarjetas();

  </script>

</body>
</html>
